name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate license and matching tag before publishing
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if (-not (Test-Path LICENSE -PathType Leaf)) {
            throw 'Publication blocked: choose and commit an approved LICENSE first.'
          }
          $source = Get-Content Cargo.toml -Raw
          $match = [regex]::Match($source, '(?m)^version\s*=\s*"([^"]+)"')
          if (-not $match.Success -or "v$($match.Groups[1].Value)" -ne $env:GITHUB_REF_NAME) {
            throw 'Tag must match v<Cargo.toml version>.'
          }
      - name: Build CUDA executable with CPU fallback
        run: cargo build --locked --release --features cuda
      - name: Assemble and verify portable ZIP
        shell: pwsh
        run: ./scripts/Build-WindowsRelease.ps1
      - name: Smoke-test packaged binary
        shell: pwsh
        run: ./target/dist/staging/wolfscribe.exe --version
      - name: Upload candidate ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: WolfScribe-Windows-x64
          path: target/dist/WolfScribe-CLI-*-windows-x64.zip
          if-no-files-found: error
      - name: Publish approved GitHub release from version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem target/dist/WolfScribe-CLI-*-windows-x64.zip)
          if ($files.Count -ne 1) { throw 'Expected one release ZIP.' }
          gh release create $env:GITHUB_REF_NAME $files[0].FullName --title "WolfScribe CLI $env:GITHUB_REF_NAME" --generate-notes --verify-tag
