name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Rust code
        run: cargo check --locked
      - name: Run tests
        run: cargo test --locked
      - name: Check CUDA-enabled build
        run: cargo check --locked --features cuda
      - name: Test CUDA feature without GPU
        run: cargo test --locked --features cuda
      - name: Parse developer PowerShell script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/Test-BlackwellCuda.ps1'),
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { $errors | Out-String | Write-Error; exit 1 }

      - name: Parse release PowerShell scripts
        shell: pwsh
        run: |
          foreach ($script in @('scripts/Build-WindowsRelease.ps1', 'scripts/New-WingetManifest.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) { $errors | Out-String | Write-Error; exit 1 }
          }
