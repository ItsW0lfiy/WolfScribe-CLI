name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Rust code
        run: cargo check --locked
      - name: Run tests
        run: cargo test --locked
      - name: Check CUDA-enabled build
        run: cargo check --locked --features cuda
      - name: Test CUDA feature without GPU
        run: cargo test --locked --features cuda
