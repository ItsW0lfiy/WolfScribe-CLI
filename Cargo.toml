[package]
name = "wolfscribe"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
parakeet-rs = "0.4"
# Required only to enforce strict CUDA provider registration.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "cuda"], optional = true }

[features]
default = []
cuda = ["parakeet-rs/cuda", "dep:ort"]
